[package]
name = "excerpt-studio"
version = "0.1.0"
description = "本地书摘分享卡片生成器"
authors = ["Huo"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.2", features = ["protocol-asset"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "z"
strip = true
